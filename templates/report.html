{% extends "base.html" %}
{% block content %}
<section class="card">
  <div class="report-header">
    <h2>{{ company }}</h2>
    <div class="actions">
      <form method="post" action="/download/html">
        <input type="hidden" name="name" value="{{ company }}">
        <input type="hidden" id="htmlContent" name="html" value="">
        <button type="submit" onclick="document.getElementById('htmlContent').value=document.documentElement.outerHTML;">Download HTML</button>
      </form>
      <button onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>
  <article class="markdown">
{{ md | safe }}
  </article>
  <details class="payload">
    <summary>Debug Payload (JSON)</summary>
    <pre>{{ payload }}</pre>
  </details>
  <p class="disclaimer">This content is informational and not investment advice. Always do your own research.</p>
</section>
{% endblock %}
